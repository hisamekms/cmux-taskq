[workspace]
members = ["."]
resolver = "3"

[package]
name = "dagq"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
description = "A dependency-aware task queue for cmux and isolated Git worktrees"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.20", features = ["v4"] }

[dev-dependencies]
tempfile = "3.25"
