name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede a pull request's older run, but keep every run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt / test / clippy / coverage
    # Apple Silicon, the platform the runtime is developed and run on.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Cargo.toml sets rust-version = "1.93"; stable is at or above it.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # The e2e tests in tests/e2e.rs need a running cmux, so they stay
      # #[ignore]d here and are run by the maintainer before integrate.
      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --fail-under-lines 80
