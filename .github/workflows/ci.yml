name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede a pull request's older run, but keep every run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt / test / clippy / coverage
    # Apple Silicon, the platform the runtime is developed and run on.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # rust-toolchain.toml pins the channel, components and target; rustup
        # installs exactly that toolchain here (the same one local builds use).
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: ADR numbers
        run: sh scripts/check-adr-numbers.sh

      - name: Migration numbers
        run: sh scripts/check-migration-numbers.sh

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # cargo llvm-cov runs the same test binaries as cargo test (unit tests in
      # src/lib.rs and tests/*.rs; the crate has no doctests) and fails if any
      # test fails, so there is no separate cargo test step.
      # The e2e tests in tests/e2e.rs need a running cmux, so they stay
      # #[ignore]d here and are run by the worker before integrate.
      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --fail-under-lines 80
